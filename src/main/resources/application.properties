server.port=8085
spring.application.name=taxi-fleet

# Base de données H2 sur fichier (indépendante des autres projets)
spring.datasource.url=jdbc:h2:file:./data/taxidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf : pas de cache en dev
spring.thymeleaf.cache=false

# Données de démonstration
app.demo-data.password=password